{margin:14px 0 8px;font-size:15px}.groups{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px}.group{min-height:62px;border:2px solid #dce5eb;border-radius:11px;background:var(--g);color:var(--fg,#142e45);font-weight:900;font-size:17px}.group span{display:block;font-size:11px}.group.active{outline:3px solid #15334c;outline-offset:1px}.search{width:100%;min-height:52px;border:2px solid #d8e3e9;border-radius:11px;padding:10px 13px;margin:9px 0;font-size:17px}.students{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;max-height:182px;overflow:auto}.student{min-height:54px;border:2px solid #dce5eb;background:#f7fafc;border-radius:11px;font-weight:800;font-size:14px}.student.active{background:#dff4e8;border-color:var(--green)}.items{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.item{position:relative;border:2px solid #e1e9ed;background:#fff;border-radius:14px;min-height:135px;padding:10px 5px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.item .emoji{font-size:clamp(32px,4vw,52px);line-height:1.2}.item strong{font-size:14px}.item .stock{font-size:12px;color:var(--green);font-weight:850}.item.out{background:#f0f2f4;filter:grayscale(.8)}.item.out .stock{color:var(--red)}.item:active{transform:scale(.98)}.btn{border:0;border-radius:12px;min-height:50px;padding:10px 15px;font-weight:850;background:var(--navy);color:white}.btn.secondary{background:#e9f0f4;color:var(--navy)}.btn.green{background:var(--green)}.btn.red{background:var(--red)}.btn.small{min-height:37px;padding:7px 10px;font-size:13px}.btnrow{display:flex;flex-wrap:wrap;gap:8px}.selected{background:#eaf6ee;border:1px solid #c8e7d3;padding:13px;border-radius:12px;font-weight:800}.loanrow{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--border);border-radius:12px;padding:11px;margin-bottom:8px;background:#fff}.loanrow strong{display:block}.loanrow small{display:block;margin-top:3px}.list{max-height:570px;overflow:auto}.empty{text-align:center;padding:28px;color:var(--muted)}.returnitems{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.returnitem{border:2px solid #dce5eb;border-radius:13px;background:#fff;padding:14px 7px;min-height:125px;font-weight:850}.returnitem.active{border-color:var(--blue);background:#e8f3fb}.returnitem .emoji{font-size:40px;display:block}.returnitem .num{display:block;color:var(--muted);font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.formrow{display:flex;flex-wrap:wrap;gap:8px;margin:9px 0}.formrow input,.formrow select{min-height:46px;border:1px solid var(--border);border-radius:10px;padding:8px;min-width:0;flex:1}.chip{display:inline-block;background:#eef3f6;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:800}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#163b52;color:white;padding:14px 18px;border-radius:12px;box-shadow:0 10px 35px #0003;z-index:10;max-width:94%;font-weight:700}.hide{display:none!important}.adminlock{padding:30px;text-align:center}.adminlock input{min-height:50px;font-size:20px;text-align:center;width:160px;border:2px solid var(--border);border-radius:10px}.footer{font-size:12px;color:var(--muted);margin-top:16px}.divider{height:1px;background:var(--border);margin:14px 0}@media(max-width:900px){.layout{grid-template-columns:1fr}.groups{grid-template-columns:repeat(7,1fr)}.items{grid-template-columns:repeat(4,1fr)}.returnitems{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.app{padding:10px}.nav{grid-template-columns:repeat(3,1fr)}.nav button{min-height:54px}.groups{grid-template-columns:repeat(4,1fr)}.students{grid-template-columns:repeat(2,1fr)}.items{grid-template-columns:repeat(2,1fr)}.returnitems{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.pill{display:none}}

.import-panel{grid-column:1/-1;border:2px solid #b6d8eb;background:#f8fcff}.import-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.import-panel textarea{width:100%;min-height:180px;resize:vertical;border:2px solid #d8e3e9;border-radius:12px;padding:12px;font:16px system-ui}.import-panel select{width:100%;min-height:50px;border:2px solid #d8e3e9;border-radius:12px;padding:8px}.previewbox{border:1px solid #d8e3e9;background:white;border-radius:12px;padding:12px;min-height:145px;max-height:280px;overflow:auto}.previewname{padding:6px 4px;border-bottom:1px solid #edf1f5;font-size:14px}.previewname.duplicate{color:#b45309;background:#fff8e9}.import-hint{background:#fff3d8;border-radius:10px;padding:11px;font-size:13px}@media(max-width:700px){.import-grid{grid-template-columns:1fr}}

/* Större, tydligare elevnamn för barn på iPad. */
.students{grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;max-height:360px;padding:3px}
.student{min-height:82px;padding:12px 10px;font-size:clamp(20px,2.2vw,26px);font-weight:850;line-height:1.2;overflow-wrap:anywhere;box-shadow:0 2px 4px #17364b12}
.student.active{border-width:3px;box-shadow:0 0 0 2px #167b5633}
.search{font-size:21px;min-height:60px}
.selected{font-size:20px}
.loanrow strong{font-size:20px;line-height:1.3}
.loanrow{min-height:70px}
.previewname{font-size:19px;line-height:1.45;padding:9px 5px}
@media(max-width:900px){.students{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:620px){.students{grid-template-columns:repeat(2,minmax(0,1fr))}.student{font-size:20px;min-height:78px}}

/* Elevknappar använder samma klassfärg som gruppknapparna. */
.student{background:var(--class-color,#f7fafc);border-color:#17364b50;color:#102c40;}
.student small{display:inline-block;margin-top:7px;padding:3px 10px;border-radius:99px;background:#ffffffbb;color:#17364b;font-size:15px;font-weight:800;}
.student.active{background:var(--class-color,#dff4e8);border:4px solid #102c40;outline:3px solid #fff;outline-offset:-8px;box-shadow:0 0 0 3px #17364b55;}
.student:focus-visible{outline:4px solid #102c40;outline-offset:2px;}

/* Tydligt val av stadie före klass */
.stage-picker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 0 16px}
.stage-btn{border:3px solid #dce5eb;background:#f7fafc;border-radius:17px;min-height:100px;padding:14px 8px;font-size:clamp(19px,2.8vw,29px);font-weight:900;color:#17364b}
.stage-btn span{display:block;font-size:clamp(13px,1.6vw,17px);font-weight:650;margin-top:5px}
.stage-btn.active{border-color:#15334c;background:#dcebf8;box-shadow:0 3px 0 #15334c}
.stage-heading{font-size:18px;font-weight:850;margin:8px 0 10px}
.groups{grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.group{min-height:76px;font-size:21px}
.group span{font-size:16px}
@media(max-width:620px){.stage-btn{min-height:84px;font-size:19px}.groups{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Trestegsflöde för iPad */
.stage-large{margin-top:24px}.stage-large .stage-btn{min-height:170px;font-size:clamp(24px,3vw,35px)}
.groups .group{min-height:108px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;font-size:clamp(28px,3.5vw,38px)}
.groups .group span{font-size:clamp(17px,2vw,23px);font-weight:750}
.stephead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;font-weight:850;font-size:19px}
.progress-steps{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 20px}.progress-steps span{border-radius:99px;background:#eef2f5;color:#627486;padding:9px;font-weight:800;font-size:12px}.progress-steps span.done{background:#d7f1e2;color:#176c4b}
.selected-big{font-size:25px;margin:12px 0 16px}.selected-big small{display:block;font-size:17px;margin-top:5px}
.students{max-height:490px;overflow:auto}
@media(max-width:620px){.stage-large{grid-template-columns:1fr}.stage-large .stage-btn{min-height:120px}.groups .group{min-height:90px}.stephead{font-size:15px}}

/* Tydligare elevnamn i fliken Aktiva lån, anpassat för iPad */
.active-loan-row{padding:18px 20px;min-height:108px;gap:18px;align-items:center}
.active-loan-info{min-width:0;flex:1}
.active-loan-name{font-size:clamp(25px,3.1vw,36px);line-height:1.15;font-weight:900;letter-spacing:-.4px;color:#102d43;overflow-wrap:anywhere}
.active-loan-details{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px;font-size:16px;font-weight:700;color:#344e62}
.active-loan-group{background:#e7f1f8;color:#17364b;padding:5px 10px;border-radius:9px;font-weight:900}
.active-loan-item{font-weight:800}
.active-loan-time{color:#52687a;font-size:14px}
.active-loan-return{font-size:16px;min-height:54px;flex-shrink:0}
@media(max-width:620px){.active-loan-row{padding:14px;align-items:flex-start}.active-loan-name{font-size:26px}.active-loan-return{font-size:14px;padding:8px;min-height:48px}.active-loan-details{font-size:14px}}

/* Stora lättlästa elevnamn under Lämna tillbaka */
.return-loan-row{padding:18px 20px;min-height:112px;gap:16px;align-items:center}
.return-loan-info{min-width:0;flex:1}
.return-loan-name{font-size:clamp(27px,3.2vw,38px);font-weight:900;line-height:1.15;letter-spacing:-.45px;color:#102d43;overflow-wrap:anywhere}
.return-loan-details{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-top:10px;font-size:16px;font-weight:700;color:#344e62}
.return-loan-group{background:#e7f1f8;color:#17364b;border-radius:9px;padding:5px 10px;font-weight:900}
.return-loan-item{font-weight:800}
.return-loan-time{font-size:14px;color:#52687a}
.return-loan-button{font-size:16px;min-height:58px;flex-shrink:0}
@media(max-width:620px){.return-loan-row{padding:14px;align-items:flex-start}.return-loan-name{font-size:29px}.return-loan-button{font-size:14px;min-height:52px;padding:8px}.return-loan-details{font-size:14px}}

/* BodenKassan 3.5: elevnamn och lånad sak på samma rad vid återlämning */
.return-loan-head{display:flex;align-items:center;gap:14px 22px;min-width:0;width:100%}
.return-loan-head .return-loan-name{flex:1 1 48%;min-width:0}
.return-loan-head .return-loan-item{flex:0 1 45%;min-width:0;font-size:clamp(19px,2.15vw,27px);font-weight:850;line-height:1.2;color:#17364b;overflow-wrap:anywhere}
.return-loan-details{margin-top:8px}
@media(max-width:620px){.return-loan-head{gap:10px}.return-loan-head .return-loan-name{font-size:clamp(21px,4vw,29px)}.return-loan-head .return-loan-item{font-size:clamp(17px,3.4vw,22px)}.return-loan-row{gap:8px}.return-loan-button{font-size:13px;padding:8px}}

/* 3.6: Extra stora namn i återlämning; sak fortsatt bredvid namnet */
.return-loan-head .return-loan-name{font-size:clamp(36px,4.3vw,52px);font-weight:950;line-height:1.08;letter-spacing:-.7px;flex:1 1 62%}
.return-loan-head .return-loan-item{font-size:clamp(18px,2vw,25px);flex:1 1 32%}
.return-loan-row{min-height:128px}
@media(max-width:620px){.return-loan-head .return-loan-name{font-size:clamp(30px,6vw,38px)}.return-loan-head .return-loan-item{font-size:17px}.return-loan-head{gap:8px}}
/* 3.7: Större namn på lånad sak bredvid elevnamnet i Lämna tillbaka */
.return-loan-head .return-loan-item{font-size:clamp(30px,3.45vw,44px);font-weight:950;line-height:1.12;letter-spacing:-.4px;color:#102d43;flex:1 1 40%;overflow-wrap:anywhere}
.return-loan-head .return-loan-name{flex:1 1 55%}
@media(max-width:620px){.return-loan-head .return-loan-item{font-size:clamp(24px,4.5vw,32px)}.return-loan-head .return-loan-name{font-size:clamp(30px,6vw,38px)}}


/* Version 3.8: Utlåningssidan använder hela bredden utan högerspalt. */
.loan-full-layout{display:block;width:100%}
.loan-full-panel{width:100%;padding:clamp(18px,2.8vw,34px)}
.loan-full-panel h2{font-size:clamp(25px,3vw,36px);margin-bottom:15px}
.loan-full-panel .stage-large{gap:22px}
.loan-full-panel .stage-large .stage-btn{min-height:205px;font-size:clamp(27px,3.4vw,43px)}
.loan-full-panel .groups{grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}
.loan-full-panel .groups .group{min-height:132px}
.loan-full-panel .students{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;max-height:540px}
.loan-full-panel .student{min-height:104px;font-size:clamp(20px,2.2vw,29px)}
.loan-full-panel .items{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.loan-full-panel .item{min-height:180px;padding:18px 10px}
.loan-full-panel .item .emoji{font-size:clamp(48px,5vw,70px)}
.loan-full-panel .item strong{font-size:clamp(18px,2vw,25px)}
.loan-full-panel .item .stock{font-size:17px}
.loan-bottom-actions{margin-top:22px;padding-top:16px;border-top:1px solid var(--border)}
@media(max-width:700px){.loan-full-panel .groups{grid-template-columns:repeat(2,minmax(0,1fr))}.loan-full-panel .students{grid-template-columns:repeat(2,minmax(0,1fr))}.loan-full-panel .items{grid-template-columns:repeat(2,minmax(0,1fr))}.loan-full-panel .stage-large .stage-btn{min-height:135px}}


/* Personalens egna bilder pa rastleksaker */
.item .item-photo,.returnitem .item-photo{width:92px;height:92px;object-fit:contain;border-radius:12px;display:block}
.loan-full-panel .item .item-photo{width:112px;height:112px}
.returnitem .item-photo{margin:0 auto 6px;width:72px;height:72px}
.item-preview{width:76px;height:76px;object-fit:contain;border-radius:12px;background:#f4f7f9;border:1px solid #dce5eb}
.item-image-settings{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:10px 0;padding:12px;border:1px solid #dce5eb;border-radius:12px}
.item-image-settings .image-actions{display:flex;gap:8px;flex-wrap:wrap}
.item-image-settings .image-actions label{cursor:pointer}
@media(max-width:620px){.loan-full-panel .item .item-photo{width:90px;height:90px}}

/* 3.11: Två stora, tydliga huvudval. Övriga verktyg ligger i en diskret utfällbar meny. */
.nav{display:block;margin-bottom:16px}
.main-nav{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.nav .main-nav-button{min-height:112px;padding:18px 12px;border:3px solid #c8d9e2;border-radius:20px;font-size:clamp(23px,3vw,36px);font-weight:900;box-shadow:0 5px 16px #15334c12}
.nav .main-nav-button:first-child{background:#e2f6e9;color:#145c3b;border-color:#9fd4b1}
.nav .main-nav-button:nth-child(2){background:#e4f1ff;color:#174b80;border-color:#a9c9e9}
.nav .main-nav-button.active{background:#15334c;color:white;border-color:#15334c;box-shadow:0 5px 18px #15334c28}
.staff-nav{margin-top:12px;text-align:right}
.staff-nav summary{display:inline-block;cursor:pointer;color:#71818c;font-size:12px;font-weight:650;padding:7px 9px;border-radius:8px;list-style:none}
.staff-nav summary::-webkit-details-marker{display:none}
.staff-nav summary::before{content:'▸ ';font-size:13px}
.staff-nav[open] summary::before{content:'▾ '}
.staff-nav-buttons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:7px}
.nav .staff-nav-buttons button{min-height:45px;padding:8px;font-size:13px;font-weight:700;border-radius:10px;color:#5d7180;background:#f5f7f8}
.nav .staff-nav-buttons button.active{background:#dbe8ef;color:#15334c;border-color:#a8c1d0}
@media(max-width:620px){.main-nav{gap:9px}.nav .main-nav-button{min-height:94px;font-size:clamp(18px,5vw,26px);padding:12px 6px}.staff-nav-buttons{grid-template-columns:1fr}}
/* Personalstyrda spärrar – tydliga kontroller och diskret barnvy */
.suspension-panel{grid-column:1/-1;border:2px solid #cbd7e1;background:#fbfdff}
.suspension-controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.suspension-controls select,.suspension-controls input{width:100%;min-height:49px;border:2px solid #d8e3e9;border-radius:10px;padding:9px;font-size:16px}
.suspension-controls label{font-weight:800;display:block;margin:8px 0 5px}
.suspension-row{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:12px;border:1px solid #dce5eb;border-radius:12px;margin:8px 0}
.suspension-alert{background:#fff4e4;border:2px solid #f0c982;border-radius:14px;padding:20px;text-align:center;font-size:23px;font-weight:850;margin-top:15px}
@media(max-width:700px){.suspension-controls{grid-template-columns:1fr}}
/* BodenKassan 3.13: tydligt bodenschema på startsidan */
.boden-schedule{margin-top:20px;border:2px solid #b9d8ec;background:#f3faff;border-radius:20px;padding:16px;color:#142e45}
.boden-schedule h2{margin:0 0 5px;font-size:clamp(22px,3.6vw,31px)}
.boden-schedule p{margin:0 0 14px;color:#38566a}
.boden-slots{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.boden-slot{border:2px solid #223c50;border-radius:12px;text-align:center;padding:11px 5px;min-height:94px;display:flex;flex-direction:column;justify-content:center;gap:3px}
.boden-slot .slot-time{font-size:13px;font-weight:750}
.boden-slot strong{font-size:clamp(22px,3.5vw,32px)}
.boden-slot .slot-class{font-size:14px;font-weight:650}
.boden-slot.now{outline:4px solid #1e8b5b;outline-offset:2px}
.boden-schedule details{margin-top:15px;border-top:1px solid #b9d8ec;padding-top:12px}
.boden-schedule summary{cursor:pointer;font-weight:800;font-size:17px;min-height:36px}
.boden-schedule img{display:block;width:100%;height:auto;border-radius:12px;margin-top:12px}

'use strict';
const GROUPS=[['G1','FSK A','#f47a78'],['G2','FSK B','#77cf8c'],['G13','1A','#51c48e'],['G14','1B','#d7a0ee'],['G11','2A','#f3a2c7'],['G12','2B','#b2e58b'],['G9','3A','#f8e56a'],['G10','3B','#398ee5'],['G7','4A','#f6a248'],['G8','4B','#f0787f'],['G5','5A','#7bcaf4'],['G6','5B','#f8de58'],['G3','6A','#f2f4f7'],['G4','6B','#388ddd']];
const INITIAL_ITEMS=[['fotboll','Fotboll','⚽',12],['basket','Basketboll','🏀',6],['hopprep','Hopprep','🪢',20],['innebandy','Innebandyklubba','🏑',16],['tennis','Tennisracket','🎾',8],['frisbee','Frisbee','🥏',10],['rockring','Rockring','⭕',10],['kon','Koner','🔺',24],['band','Lekband','🎗️',12],['krita','Gatukritor','🖍️',15],['boll','Mjukboll','🏐',8],['styltor','Styltor','🦯',6]];
const KEY='boden-kassan-2-demo-v1';
function initial(){return {students:GROUPS.flatMap((g,i)=>[1,2].map(n=>({id:g[0]+'-'+n,name:'Testelev '+String(i*2+n).padStart(2,'0'),group:g[0]}))),items:INITIAL_ITEMS.map(x=>({id:x[0],name:x[1],emoji:x[2],total:x[3],missing:0})),loans:[],history:[],suspensions:[]};}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.students)&&Array.isArray(x.items)&&Array.isArray(x.loans))return {...initial(),...x}}catch(e){}return initial()}
let db=load(),tab='loan',stage='',group='',studentId='',search='',returnItem='',returnSearch='',admin=false,pin='2627',undo=null;
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function activeSuspension(id){
 const entries=Array.isArray(db.suspensions)?db.suspensions:[];
 const today=new Date().toLocaleDateString('sv-SE',{year:'numeric',month:'2-digit',day:'2-digit'});
 return entries.find(x=>x.studentId===id&&(x.mode==='manual'||(x.mode==='date'&&typeof x.until==='string'&&x.until>=today)))||null;
}
function suspensionLabel(x){return x.mode==='manual'?'Tills personalen häver spärren':'Till och med '+x.until}
function renderSuspensionControls(){
 const active=(Array.isArray(db.suspensions)?db.suspensions:[]).filter(x=>activeSuspension(x.studentId)===x);
 return `<section class="panel suspension-panel"><h2>🔒 Avstängda elever</h2><p class="muted">Endast personal kan registrera eller häva en utlåningsspärr. Eleven kan alltid lämna tillbaka utrustning. Spärren gäller bara i den här webbläsarens lokala data.</p>
 <div class="suspension-controls"><div><label for="suspGroup">1. Välj grupp</label><select id="suspGroup" onchange="updateSuspensionStudentList()">${GROUPS.map(g=>`<option value="${g[0]}">${esc(g[1])} · ${g[0]}</option>`).join('')}</select><label for="suspStudent">2. Välj elev</label><select id="suspStudent"></select></div>
 <div><label for="suspMode">3. Hur länge?</label><select id="suspMode" onchange="toggleSuspensionDate()"><option value="date">Till och med ett slutdatum</option><option value="manual">Tills personalen häver spärren</option></select><div id="suspDateBox"><label for="suspUntil">Slutdatum (inklusive denna dag)</label><input id="suspUntil" type="date"></div></div></div>
 <p><button class="btn red" onclick="setSuspension()">🔒 Spärra utlåning</button></p>
 <h3>Aktuella spärrar (${active.length})</h3>${active.map(x=>{const st=studentOf(x.studentId);return `<div class="suspension-row"><div><strong>${esc(st?.name||'Borttagen elev')}</strong><br><small>${esc(GROUPS.find(g=>g[0]===st?.group)?.[1]||st?.group||'')} · ${esc(suspensionLabel(x))}</small></div><button class="btn green small" onclick="clearSuspension('${esc(x.studentId)}')">🔓 Häv spärr</button></div>`}).join('')||'<p class="muted">Inga aktiva spärrar.</p>'}</section>`;
}
function initSuspensionControls(){const date=$('suspUntil');if(date)date.value=new Date().toLocaleDateString('sv-SE',{year:'numeric',month:'2-digit',day:'2-digit'});updateSuspensionStudentList()}
function updateSuspensionStudentList(){const g=$('suspGroup'),sel=$('suspStudent');if(!g||!sel)return;sel.innerHTML=db.students.filter(s=>s.group===g.value).map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('')}
function toggleSuspensionDate(){const el=$('suspDateBox');if(el)el.style.display=$('suspMode').value==='date'?'':'none'}
function setSuspension(){if(!admin)return;const id=$('suspStudent')?.value,mode=$('suspMode')?.value,until=$('suspUntil')?.value;if(!id||!studentOf(id))return showToast('Välj en elev');const today=new Date().toLocaleDateString('sv-SE',{year:'numeric',month:'2-digit',day:'2-digit'});if(mode==='date'&&(!/^\d{4}-\d{2}-\d{2}$/.test(until)||until<today))return showToast('Välj dagens datum eller ett senare datum');if(!confirm('Spärra utlåning för '+studentOf(id).name+'?'))return;db.suspensions=(db.suspensions||[]).filter(x=>x.studentId!==id);db.suspensions.push({studentId:id,mode,until:mode==='date'?until:null,createdAt:new Date().toISOString()});save();render();showToast('Utlåningen har spärrats')}
function clearSuspension(id){if(!admin)return;const st=studentOf(id);if(!confirm('Häv utlåningsspärren för '+(st?.name||'eleven')+'?'))return;db.suspensions=(db.suspensions||[]).filter(x=>x.studentId!==id);save();render();showToast('Spärren har hävts')}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Kunde inte spara i webbläsaren. Exportera en säkerhetskopia från Personalläge.')}}
function available(item){return Math.max(0,item.total-item.missing-db.loans.filter(l=>l.itemId===item.id).length)}
function itemOf(id){return db.items.find(i=>i.id===id)}function studentOf(id){return db.students.find(s=>s.id===id)}
function safePhoto(i){return typeof i?.photo==='string' && /^data:image\/(?:jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(i.photo) ? i.photo : ''}
function itemVisual(i){const photo=safePhoto(i);return photo?`<img class="item-photo" src="${photo}" alt="${esc(i.name)}">`:`<span class="emoji">${esc(i.emoji)}</span>`}
function itemSettingsPreview(i){const photo=safePhoto(i);return photo?`<img class="item-preview" src="${photo}" alt="Bild på ${esc(i.name)}">`:`<span style="font-size:46px;min-width:76px;text-align:center">${esc(i.emoji)}</span>`}
async function uploadItemImage(input,id){
 const file=input.files?.[0],item=itemOf(id);if(!file||!item)return;
 if(!['image/jpeg','image/png','image/webp'].includes(file.type)){alert('Välj en JPG-, PNG- eller WebP-bild.');input.value='';return}
 if(file.size>8*1024*1024){alert('Bilden är för stor. Välj en bild under 8 MB.');input.value='';return}
 let url='';
 try{
  url=URL.createObjectURL(file);
  const img=new Image();img.src=url;await img.decode();
  const scale=Math.min(1,360/img.naturalWidth,360/img.naturalHeight),w=Math.max(1,Math.round(img.naturalWidth*scale)),h=Math.max(1,Math.round(img.naturalHeight*scale));
  const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
  const photo=canvas.toDataURL('image/jpeg',0.76),old=item.photo;
  item.photo=photo;
  try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){item.photo=old;alert('Bilden kunde inte sparas. Webbläsarens lagringsutrymme kan vara fullt. Prova en mindre bild.');return}

function removeItemImage(id){const item=itemOf(id);if(!item)return;const old=item.photo;delete item.photo;try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){item.photo=old;alert('Kunde inte spara ändringen.');return}render();showToast('Standardbilden är tillbaka')}

function showToast(message){const t=$('toast');t.textContent=message;t.classList.remove('hide');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>t.classList.add('hide'),2800)}
function changeTab(t){tab=t;render()}
function render(){const mainNavs=[['loan','🛒 Låna ut'],['return','↩️ Lämna tillbaka']];const staffNavs=[['active','📋 Aktiva lån'],['missing','⚠️ Saknade saker'],['admin','⚙️ Personalläge']];const staffOpen=staffNavs.some(([id])=>id===tab);$('nav').innerHTML=`<div class="main-nav">${mainNavs.map(([id,label])=>`<button class="main-nav-button ${tab===id?'active':''}" onclick="changeTab('${id}')">${label}</button>`).join('')}</div><details class="staff-nav" ${staffOpen?'open':''}><summary>⚙️ Fler funktioner för personal</summary><div class="staff-nav-buttons">${staffNavs.map(([id,label])=>`<button class="${tab===id?'active':''}" onclick="changeTab('${id}')">${label}${id==='active'?` <span class="count">${db.loans.length}</span>`:''}</button>`).join('')}</div></details>`;const total=db.items.reduce((a,i)=>a+i.total,0),missing=db.items.reduce((a,i)=>a+i.missing,0);$('stats').innerHTML=`<div class="stat"><b>${db.loans.length}</b> utlånade</div><div class="stat"><b>${total-missing-db.loans.length}</b> tillgängliga</div><div class="stat"><b>${missing}</b> saknade/trasiga</div><div class="stat"><b>${db.students.length}</b> elever</div>`;({loan:renderLoan,return:renderReturn,active:renderActive,missing:renderMissing,admin:renderAdmin}[tab])()}
function groupButtons(){const visible=GROUPS.filter(g=>stage==='low'?['G1','G2','G13','G14','G11','G12','G9','G10'].includes(g[0]):['G7','G8','G5','G6','G3','G4'].includes(g[0]));return `<div class="stage-picker"><button class="stage-btn ${stage==='low'?'active':''}" onclick="chooseStage('low')">🏫 Lågstadiet<span>Förskoleklass–åk 3</span></button><button class="stage-btn ${stage==='middle'?'active':''}" onclick="chooseStage('middle')">🎒 Mellanstadiet<span>Åk 4–6</span></button></div><div class="stage-heading">${stage==='low'?'Välj klass i lågstadiet':'Välj klass i mellanstadiet'}</div><div class="groups">${visible.map(g=>`<button class="group ${group===g[0]?'active':''}" style="--g:${g[2]}" onclick="chooseGroup('${g[0]}')">${g[0]}<span>${g[1]}</span></button>`).join('')}</div>`}
function studentButtons(){let q=search.toLocaleLowerCase('sv');let filtered=db.students.filter(s=>(q?s.name.toLocaleLowerCase('sv').includes(q)||GROUPS.find(g=>g[0]===s.group)?.[1].toLowerCase().includes(q):s.group===group));return `<div class="students">${filtered.slice(0,80).map(s=>`<button class="student ${studentId===s.id?'active':''}" style="--class-color:${GROUPS.find(g=>g[0]===s.group)?.[2]||'#f7fafc'}" onclick="chooseStudent('${esc(s.id)}')">${esc(s.name)}<br><small>${esc(GROUPS.find(g=>g[0]===s.group)?.[1]||s.group)}</small></button>`).join('')||'<p class="muted">Inga träffar</p>'}</div>`}

function renderBodenSchedule(){
 const now=new Date(),day=(now.getDay()+6)%7;
 const today=day<5?BODEN_SCHEDULE[day]:null;
 const clock=now.getHours()*60+now.getMinutes();
 const cards=today?`<div class="boden-slots">${today.map((id,i)=>{const g=GROUPS.find(x=>x[0]===id),t=BODEN_TIMES[i],start=Number(t[0].slice(0,2))*60+Number(t[0].slice(3)),end=Number(t[1].slice(0,2))*60+Number(t[1].slice(3));return `<div class="boden-slot ${clock>=start&&clock<end?'now':''}" style="background:${g?.[2]||'#fff'}"><span class="slot-time">${t[0]}–${t[1]}</span><strong>${id}</strong><span class="slot-class">${esc(g?.[1]||'')}</span></div>`}).join('')}</div>`:'<p class="offday">Inga schemalagda bodpass idag. Se hela veckans schema nedan.</p>';
 return `<section class="boden-schedule" aria-label="Bodenschema"><h2>📅 Bodenschema</h2><p>${today?`Idag, ${BODEN_DAYS[day]} – vilka står i Boden?`:'Veckans gruppfördelning'}</p>${cards}<details><summary>🗓️ Visa hela Bodenschemat</summary><img src="${BODEN_POSTER}" alt="Bodenschema måndag till fredag med fyra rastpass per dag"></details></section>`;
}

function renderLoan(){
const student=studentOf(studentId);
let main='';
if(!stage){
 main=`${renderBodenSchedule()}<h2>🏫 Steg 1 av 3 – Välj stadie</h2><p class="muted">Tryck på lågstadiet eller mellanstadiet.</p><div class="stage-picker stage-large"><button class="stage-btn" onclick="chooseStage('low')">🏫 Lågstadiet<span>Förskoleklass – årskurs 3</span></button><button class="stage-btn" onclick="chooseStage('middle')">🎒 Mellanstadiet<span>Årskurs 4 – 6</span></button></div>`;
}else if(!group){
 const visible=GROUPS.filter(g=>stage==='low'?['G1','G2','G13','G14','G11','G12','G9','G10'].includes(g[0]):['G7','G8','G5','G6','G3','G4'].includes(g[0]));
 main=`<div class="stephead"><button class="btn secondary small" onclick="chooseStage('')">← Tillbaka</button><span>${stage==='low'?'🏫 Lågstadiet':'🎒 Mellanstadiet'}</span></div><h2>📚 Steg 2 av 3 – Välj din grupp</h2><p class="muted">Gruppen står stort. Klassen står under.</p><div class="groups">${visible.map(g=>`<button class="group" style="--g:${g[2]}" onclick="chooseGroup('${g[0]}')"><strong>${g[0]}</strong><span>${g[1]}</span></button>`).join('')}</div>`;
}else if(!student){
 const info=GROUPS.find(g=>g[0]===group);
 main=`<div class="stephead"><button class="btn secondary small" onclick="chooseGroup('')">← Tillbaka</button><span>${info[0]} · ${info[1]}</span></div><h2>👤 Steg 3 av 3 – Välj ditt namn</h2><input class="search" id="search" placeholder="🔎 Sök ditt namn..." value="${esc(search)}" oninput="setSearch(this.value)">${studentButtons()}`;
}else{
 const info=GROUPS.find(g=>g[0]===student.group);
 main=`<div class="stephead"><button class="btn secondary small" onclick="clearStudent()">← Byt elev</button><span>${info?.[0]||''} · ${info?.[1]||''}</span></div><h2>⚽ Välj vad du vill låna</h2><div class="selected selected-big">👤 ${esc(student.name)} <small>${info?.[0]||''} · ${info?.[1]||''}</small></div><div class="items">${db.items.map(i=>`<button class="item ${available(i)===0?'out':''}" ${available(i)===0?'disabled':''} onclick="lend('${esc(i.id)}')">${itemVisual(i)}<strong>${esc(i.name)}</strong><span class="stock">${available(i)?available(i)+' kvar':'SLUT'}</span></button>`).join('')}</div><p class="muted">Efter ett lån kommer du automatiskt tillbaka till gruppvalet för nästa elev.</p>`;
}
$('screen').innerHTML=`<div class="loan-full-layout"><section class="panel loan-full-panel">${main}${undo?'<div class="loan-bottom-actions"><button class="btn secondary" onclick="undoLast()">↶ Ångra senaste åtgärden</button></div>':''}</section></div>`;
}
function chooseStage(s){stage=s;group='';studentId='';search='';render()}
function chooseGroup(g){group=g;studentId='';search='';render()}
function setSearch(v){search=v;const el=$('search');let start=el.selectionStart;const st=$('screen');const list=st.querySelector('.students');if(list)list.outerHTML=studentButtons();if(el)try{el.setSelectionRange(start,start)}catch(e){}}
function chooseStudent(id){studentId=id;render()}
function clearStudent(){studentId='';search='';render()}
function lend(id){const i=itemOf(id),s=studentOf(studentId);if(!i||!s||available(i)<=0)return;if(activeSuspension(s.id)){render();return showToast('Utlåning pausad – kontakta personalen')}const l={id:'L'+Date.now()+'-'+Math.random().toString(36).slice(2,7),itemId:id,studentId:s.id,at:new Date().toISOString()};db.loans.push(l);db.history.push({type:'lend',...l});undo={type:'lend',loan:l};save();group='';studentId='';search='';tab='loan';render();window.scrollTo({top:0,behavior:'instant'});showToast('✓ '+i.name+' utlånad till '+s.name+'! Redo för nästa elev.')}
function activeLoanRow(l){const i=itemOf(l.itemId),s=studentOf(l.studentId),g=GROUPS.find(g=>g[0]===s?.group);return `<div class="loanrow active-loan-row"><div class="active-loan-info"><div class="active-loan-name">${esc(s?.name||'Borttagen elev')}</div><div class="active-loan-details"><span class="active-loan-group">${esc(g?.[0]||s?.group||'')} · ${esc(g?.[1]||'')}</span><span class="active-loan-item">${esc(i?.emoji||'📦')} ${esc(i?.name||'Borttagen sak')}</span><span class="active-loan-time">Lånad ${new Date(l.at).toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'})}</span></div></div><button class="btn green active-loan-return" onclick="returnLoan('${esc(l.id)}')">✓ Återlämna</button></div>`}
function loanRow(l,withButton=true){const i=itemOf(l.itemId),s=studentOf(l.studentId),g=GROUPS.find(g=>g[0]===s?.group);return `<div class="loanrow return-loan-row"><div class="return-loan-info"><div class="return-loan-head"><div class="return-loan-name">${esc(s?.name||'Borttagen elev')}</div><div class="return-loan-item">${esc(i?.emoji||'📦')} ${esc(i?.name||'Borttagen sak')}</div></div><div class="return-loan-details"><span class="return-loan-group">${esc(g?.[0]||s?.group||'')} · ${esc(g?.[1]||'')}</span><span class="return-loan-time">Lånad ${new Date(l.at).toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'})}</span></div></div>${withButton?`<button class="btn green return-loan-button" onclick="returnLoan('${esc(l.id)}')">✓ Lämna tillbaka</button>`:''}</div>`}
function returnLoan(id){const n=db.loans.findIndex(l=>l.id===id);if(n<0)return;const l=db.loans.splice(n,1)[0];db.history.push({type:'return',...l});undo={type:'return',loan:l};save();render();showToast('✓ Återlämnat!')}
function undoLast(){if(!undo)return;if(undo.type==='lend'){db.loans=db.loans.filter(l=>l.id!==undo.loan.id)}else if(!db.loans.some(l=>l.id===undo.loan.id)){db.loans.push(undo.loan)}db.history.push({type:'undo',id:undo.loan.id,at:new Date().toISOString()});undo=null;save();render();showToast('Senaste åtgärden ångrad')}
function renderReturn(){let filtered=db.loans.filter(l=>!returnItem||l.itemId===returnItem).filter(l=>{let s=studentOf(l.studentId),i=itemOf(l.itemId),q=returnSearch.toLowerCase();return !q||s?.name.toLowerCase().includes(q)||i?.name.toLowerCase().includes(q)});$('screen').innerHTML=`<div class="layout"><section class="panel"><h2>↩️ Expressåterlämning</h2><p class="muted">1. Tryck på bilden av saken som lämnas tillbaka. 2. Tryck på <b>Åter</b> bredvid elevens namn.</p><div class="returnitems"><button class="returnitem ${!returnItem?'active':''}" onclick="setReturnItem('')"><span class="emoji">📦</span>Alla saker<span class="num">${db.loans.length} lån</span></button>${db.items.filter(i=>db.loans.some(l=>l.itemId===i.id)).map(i=>`<button class="returnitem ${returnItem===i.id?'active':''}" onclick="setReturnItem('${esc(i.id)}')">${itemVisual(i)}${esc(i.name)}<span class="num">${db.loans.filter(l=>l.itemId===i.id).length} utlånade</span></button>`).join('')}</div><input class="search" placeholder="🔎 Filtrera på elev eller sak..." value="${esc(returnSearch)}" oninput="setReturnSearch(this.value)"><div class="list" id="returnList">${filtered.map(l=>loanRow(l)).join('')||'<div class="empty">Inga matchande lån 🎉</div>'}</div></section><aside class="panel"><h2>Snabb återlämning</h2><p>Det går att återlämna utan att söka igenom alla 300 elever. Välj bara saken och rätt elev.</p><div class="selected">📦 ${db.loans.length} saker är just nu utlånade</div>${undo?'<p><button class="btn secondary" onclick="undoLast()">↶ Ångra senaste åtgärden</button></p>':''}</aside></div>`}
function setReturnItem(id){returnItem=id;render()}
function setReturnSearch(v){returnSearch=v;render();const e=$('screen').querySelector('.search');e.focus();e.setSelectionRange(v.length,v.length)}
function renderActive(){let loans=db.loans.slice().reverse();$('screen').innerHTML=`<div class="panel"><div class="row"><h2>📋 Aktiva lån (${loans.length})</h2><button class="btn secondary small" onclick="changeTab('return')">Gå till återlämning →</button></div><div class="list">${loans.map(l=>activeLoanRow(l)).join('')||'<div class="empty">Alla saker är tillbaka 🎉</div>'}</div></div>`}
function renderMissing(){let m=db.items.filter(i=>i.missing>0);$('screen').innerHTML=`<div class="layout"><section class="panel"><h2>⚠️ Saknade eller trasiga saker</h2><p class="muted">Saker som markerats saknade/trasiga räknas bort från lagret. Ändringar görs i Personalläge.</p>${m.map(i=>`<div class="loanrow"><strong>${esc(i.emoji)} ${esc(i.name)}</strong><span class="chip">${i.missing} saknade/trasiga</span></div>`).join('')||'<div class="empty">Inga saker är markerade saknade eller trasiga.</div>'}</section><aside class="panel"><h2>Vad saknas efter rasten?</h2><p>Kontrollera också aktiva lån. Det visar vilka elever som fortfarande har utrustning ute.</p><button class="btn secondary" onclick="changeTab('active')">Visa aktiva lån (${db.loans.length})</button></aside></div>`}
function renderAdmin(){if(!admin){$('screen').innerHTML=`<div class="panel adminlock"><h2>🔒 Personalläge</h2><p>Inställningar, elever, lager och säkerhetskopior.</p><input type="password" id="pin" inputmode="numeric" placeholder="PIN" maxlength="8" onkeydown="if(event.key==='Enter')unlock()"><p><button class="btn" onclick="unlock()">Lås upp</button></p><small>PIN-koden är avsedd för personal. Detta är endast en enkel spärr i prototypen, inte riktig åtkomstsäkerhet.</small></div>`;return} $('screen').innerHTML=`<div class="grid2">${renderSuspensionControls()}<section class="panel import-panel"><h2>📋 Massimport av elever – klass för klass</h2><p class="muted">Kopiera en digital klasslista, klistra in ett namn per rad och kontrollera förhandsgranskningen. Dubbletter i samma grupp hoppas över.</p><div class="import-hint">🔒 <b>Endast testuppgifter:</b> Denna HTML-fil har ingen säker serverinloggning eller godkänd elevdatalagring. Klistra inte in riktiga elevnamn förrän skolans IT och dataskyddsansvariga har godkänt lösningen.</div><div class="import-grid" style="margin-top:14px"><div><h3>1. Välj grupp</h3><select id="bulkGroup" onchange="clearBulkPreview()">${GROUPS.map(g=>`<option value="${g[0]}">${g[1]} – ${g[0]}</option>`).join('')}</select><h3>2. Klistra in namn</h3><textarea id="bulkNames" placeholder="Testelev A&#10;Testelev B&#10;Testelev C" oninput="clearBulkPreview()"></textarea><p class="muted">Ett namn per rad. Tomma rader ignoreras.</p><button class="btn secondary" onclick="previewBulk()">👁 Förhandsgranska</button></div><div><h3>3. Kontrollera och importera</h3><div class="previewbox" id="bulkPreview"><div class="empty">Förhandsgranskningen visas här.</div></div><p class="muted" id="bulkCount"></p><button class="btn green" id="bulkConfirm" disabled onclick="commitBulk()">✓ Importera testelever</button></div></div></section><section class="panel"><div class="row"><h2>👥 Elever (${db.students.length})</h2><button class="btn secondary small" onclick="admin=false;render()">🔒 Lås</button></div><div class="formrow"><select id="newGroup">${GROUPS.map(g=>`<option value="${g[0]}">${g[0]} · ${g[1]}</option>`).join('')}</select><input id="newName" placeholder="Namn på TESTELEV" maxlength="70"><button class="btn green" onclick="addStudent()">+ Lägg till</button></div><p class="muted">Ta bort testelever som inte har aktiva lån:</p><div class="list" style="max-height:350px">${db.students.map(s=>`<div class="loanrow"><div>${esc(s.name)} <small>${esc(GROUPS.find(g=>g[0]===s.group)?.[1])}</small></div><button class="btn secondary small" onclick="renameStudent('${esc(s.id)}')">Ändra</button><button class="btn red small" ${db.loans.some(l=>l.studentId===s.id)?'disabled':''} onclick="removeStudent('${esc(s.id)}')">Ta bort</button></div>`).join('')}</div></section><section class="panel"><h2>📦 Lager och saknade saker</h2><div class="list" style="max-height:520px">${db.items.map(i=>`<div class="loanrow"><div><strong>${esc(i.emoji)} ${esc(i.name)}</strong><small>${available(i)} kvar · ${db.loans.filter(l=>l.itemId===i.id).length} utlånade</small></div><div><label style="font-size:11px">Totalt <input aria-label="Totalt ${esc(i.name)}" type="number" min="0" max="999" value="${i.total}" style="width:62px;padding:6px" onchange="updateItem('${esc(i.id)}','total',this.value)"></label><label style="font-size:11px">Saknade <input aria-label="Saknade ${esc(i.name)}" type="number" min="0" max="999" value="${i.missing}" style="width:62px;padding:6px" onchange="updateItem('${esc(i.id)}','missing',this.value)"></label></div></div>`).join('')}</div><h3>🖼️ Byt bilder på sakerna</h3><p class="muted">Välj en egen bild för varje rastleksak, till exempel en bild på er basketboll. Bilderna förminskas automatiskt och används på utlånings- och återlämningsknapparna. Endast testbilder – använd inga bilder på barn.</p><div class="item-image-list">${db.items.map(i=>`<div class="item-image-settings">${itemSettingsPreview(i)}<div style="flex:1;min-width:150px"><strong>${esc(i.name)}</strong><small>${safePhoto(i)?'Egen bild':'Standardbild (emoji)'}</small></div><div class="image-actions"><label class="btn secondary small">📷 Välj bild<input type="file" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="uploadItemImage(this,'${esc(i.id)}')"></label>${safePhoto(i)?`<button class="btn secondary small" onclick="removeItemImage('${esc(i.id)}')">↶ Standardbild</button>`:''}</div></div>`).join('')}</div><h3>Ny sorts utrustning</h3><div class="formrow"><input id="itemName" placeholder="Namn" maxlength="50"><input id="itemEmoji" placeholder="Emoji ⚽" maxlength="8" style="max-width:95px"><input id="itemTotal" type="number" min="1" max="999" value="5" style="max-width:75px"><button class="btn green" onclick="addItem()">+ Lägg till</button></div></section><section class="panel"><h2>💾 Säkerhetskopior</h2><p class="muted">Exportera eller importera testdata i JSON-format. Innehåller alla registrerade elever och lån. Dela inte filer med riktiga personuppgifter.</p><div class="btnrow"><button class="btn secondary" onclick="exportData()">⬇ Exportera JSON</button><label class="btn secondary" style="display:inline-flex;align-items:center;cursor:pointer">⬆ Importera JSON<input type="file" accept=".json,application/json" style="display:none" onchange="importData(this)"></label></div><div class="divider"></div><button class="btn red" onclick="resetData()">🗑 Nollställ all testdata</button></section><section class="panel"><h2>ℹ️ Om prototypen</h2><p><b>Personallås:</b> enkel PIN-spärr (ej säker autentisering)</p><p><b>Lagring:</b> endast lokalt i webbläsaren. Om webbläsardata rensas kan allt försvinna. Exportera regelbundet.</p><p><b>Inte för skarp drift:</b> för riktiga elevuppgifter behövs skolans IT-godkända lagring, behörigheter, rutiner och dataskyddsbedömning.</p></section></div>`;initSuspensionControls()}

let bulkPreviewData=null;
function normalizedName(n){return n.trim().replace(/\s+/g,' ').toLocaleLowerCase('sv-SE')}
function clearBulkPreview(){bulkPreviewData=null;const p=document.getElementById('bulkPreview'),b=document.getElementById('bulkConfirm'),c=document.getElementById('bulkCount');if(p)p.innerHTML='<div class="empty">Tryck på Förhandsgranska för att se listan.</div>';if(b)b.disabled=true;if(c)c.textContent=''}
function previewBulk(){const group=document.getElementById('bulkGroup').value,raw=document.getElementById('bulkNames').value,lines=raw.split(/\r?\n/).map(n=>n.trim().replace(/\s+/g,' ')).filter(Boolean),existing=new Set(db.students.filter(s=>s.group===group).map(s=>normalizedName(s.name))),seen=new Set(),rows=[];for(const name of lines){const key=normalizedName(name),duplicate=existing.has(key)||seen.has(key);rows.push({name,duplicate});seen.add(key)}bulkPreviewData={group,raw,rows};const unique=rows.filter(r=>!r.duplicate).length;document.getElementById('bulkPreview').innerHTML=rows.length?rows.map(r=>'<div class="previewname '+(r.duplicate?'duplicate':'')+'">'+esc(r.name)+(r.duplicate?' – finns redan / dubblett':' ✓')+'</div>').join(''):'<div class="empty">Inga namn hittades.</div>';document.getElementById('bulkCount').textContent=unique+' nya • '+(rows.length-unique)+' dubbletter hoppas över';document.getElementById('bulkConfirm').disabled=unique===0}
function commitBulk(){if(!bulkPreviewData)return;const {group,raw,rows}=bulkPreviewData;if(document.getElementById('bulkGroup').value!==group||document.getElementById('bulkNames').value!==raw){clearBulkPreview();return showToast('Listan har ändrats. Förhandsgranska igen.')}if(!confirm('Importera '+rows.filter(r=>!r.duplicate).length+' TESTELEVER till '+group+'? Använd inga riktiga elevuppgifter i prototypen.'))return;const existing=new Set(db.students.filter(s=>s.group===group).map(s=>normalizedName(s.name)));let added=0;for(const r of rows){const key=normalizedName(r.name);if(r.duplicate||existing.has(key))continue;db.students.push({id:'S'+Date.now()+'-'+added+'-'+Math.random().toString(36).slice(2,7),name:r.name,group});existing.add(key);added++}save();render();showToast('✓ '+added+' testelever importerade till '+group)}
function renameStudent(id){const s=studentOf(id);if(!s)return;const name=prompt('Ändra testnamn:',s.name);if(name===null)return;const cleaned=name.trim().replace(/\s+/g,' ');if(!cleaned)return showToast('Namnet får inte vara tomt');if(db.students.some(x=>x.id!==id&&x.group===s.group&&normalizedName(x.name)===normalizedName(cleaned)))return showToast('Namnet finns redan i samma grupp');s.name=cleaned;save();render();showToast('Namnet uppdaterat')}

function unlock(){if($('pin').value===pin){admin=true;render()}else showToast('Fel PIN')}
function addStudent(){let name=$('newName').value.trim(),g=$('newGroup').value;if(!name)return showToast('Skriv ett testnamn');if(db.students.some(s=>s.group===g&&normalizedName(s.name)===normalizedName(name)))return showToast('Namnet finns redan i gruppen');db.students.push({id:'S'+Date.now(),name,group:g});save();render();showToast('Testelev tillagd')}
function removeStudent(id){if(db.loans.some(l=>l.studentId===id))return;db.students=db.students.filter(s=>s.id!==id);db.suspensions=(db.suspensions||[]).filter(x=>x.studentId!==id);if(studentId===id)studentId='';save();render()}
function updateItem(id,field,value){const i=itemOf(id),v=Number(value);if(!i||!Number.isInteger(v)||v<0||v>999)return render();let outstanding=db.loans.filter(l=>l.itemId===id).length;if(field==='total'&&v<i.missing+outstanding)return showToast('Totalt kan inte vara färre än saknade + utlånade');if(field==='missing'&&v>i.total-outstanding)return showToast('För många saknade i förhållande till lagret');i[field]=v;save();render()}
function addItem(){let name=$('itemName').value.trim(),emoji=$('itemEmoji').value.trim()||'📦',total=Number($('itemTotal').value);if(!name||!Number.isInteger(total)||total<1||total>999)return showToast('Ange namn och antal');db.items.push({id:'I'+Date.now(),name,emoji,total,missing:0});save();render()}
function exportData(){const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='BodenKassan-testdata-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1500)}
async function importData(input){const f=input.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.students)||!Array.isArray(d.items)||!Array.isArray(d.loans))throw Error();if(!confirm('Ersätta nuvarande testdata med innehållet i filen?'))return;db=d;save();render();showToast('Testdata importerad')}catch(e){alert('Filen innehåller inte giltiga BodenKassan-data.')}}
function resetData(){if(!confirm('Radera ALLA registrerade testelever, lån och lagerändringar?'))return;db=initial();stage='';group='';studentId='';search='';returnItem='';returnSearch='';undo=null;save();render();showToast('Testdata återställd')}
render();
</script></body></html>
